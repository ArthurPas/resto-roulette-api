name: Backend CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    build-and-test:
        name: Build and Test Backend
        runs-on: self-hosted

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                path: |
                    ~/.gradle/caches
                    ~/.gradle/wrapper
                key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                restore-keys: ${{ runner.os }}-gradle-

            - name: Run tests
              run: ./gradlew test --no-daemon

            - name: Build JAR
              run: ./gradlew bootJar --no-daemon

            - name: Archive JAR artifact
              uses: actions/upload-artifact@v4
              with:
                  name: backend-jar
                  path: build/libs/*.jar

    deploy-to-vm:
        name: Deploy to Debian VM
        needs: build-and-test
        runs-on: self-hosted
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Sync project to remote VM (rsync)
              run: |
                rsync -av --delete \
                  --exclude=".git" \
                  --exclude=".github" \
                  --exclude="build" \
                  --exclude="out" \
                  . andydck@192.168.226.129:/home/andydck/apps/resto-roulette-api
              env:
                RSYNC_RSH: "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
            
            - name: Start stack on remote with Doppler + Podman
              run: |
                ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no andydck@192.168.226.129 << 'EOF'
                set -euo pipefail
        
                cd /home/andydck/apps/resto-roulette-api
        
                doppler run -- podman compose up -d --build
                EOF