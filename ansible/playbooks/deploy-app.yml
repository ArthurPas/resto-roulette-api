- name: Deploy Spring Boot backend JAR
  hosts: app
  become: no
  vars:
    app_dir: "/home/{{ ansible_user }}/apps/resto"
    local_repo: "/Users/andydecock/Code/restoRoulette/backend/test_backend/tes_resto-roulette-api/resto-roulette-api"
  vars_files:
    - ../group_vars/app/vault.yml

  tasks:
    - name: Configure Doppler globally for user
      become: yes
      become_user: andydck
      shell: |
        mkdir -p /home/andydck/.doppler
        export DOPPLER_TOKEN="{{ doppler_service_token }}"
        export DOPPLER_PROJECT="{{ doppler_project }}"
        export DOPPLER_CONFIG="{{ doppler_config }}"
        doppler configure set token "$DOPPLER_TOKEN" --scope /home/andydck
        doppler configure set project "$DOPPLER_PROJECT" --scope /home/andydck
        doppler configure set config "$DOPPLER_CONFIG" --scope /home/andydck

    - name: Build Spring Boot JAR locally
      delegate_to: localhost
      shell: |
        cd "{{ local_repo }}"
        ./gradlew clean bootJar
      args:
        executable: /bin/bash

    - name: Package artifact
      delegate_to: localhost
      shell: |
        cd "{{ local_repo }}/build/libs"
        tar -czf resto-backend.tar.gz *.jar
      args:
        executable: /bin/bash

    - name: Upload artifact
      copy:
        src: "{{ local_repo }}/build/libs/resto-backend.tar.gz"
        dest: "{{ app_dir }}/resto-backend.tar.gz"
        mode: "0644"

    - name: Extract new artifact
      shell: |
        cd "{{ app_dir }}"
        tar -xzf resto-backend.tar.gz --overwrite
      args:
        executable: /bin/bash

    - name: Restart Spring Boot backend
      become: yes
      systemd:
        name: resto-backend.service
        state: restarted
        daemon_reload: yes