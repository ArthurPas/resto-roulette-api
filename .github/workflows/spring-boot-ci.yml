# This GitHub Action workflow builds and tests a Spring Boot application.

# 1. Workflow Name: Defines the name of the workflow as it appears in the GitHub Actions UI.
name: Spring Boot CI

# 2. Trigger: Specifies the events that trigger this workflow.
# It runs on pull requests to 'main' and on pushes (e.g., merges) to 'develop'.
on:
  pull_request:
    branches: [ "main", "develop" ]
  push:
    branches: [ "develop" ]

# 3. Jobs: A workflow run is made up of one or more jobs.
jobs:
  # 'build' is the ID of the job.
  build:
    # Runner: Specifies the type of machine to run the job on.
    # 'ubuntu-latest' is the standard, most efficient option for GitHub-hosted runners.
    # There are no official "thinner" runners in the standard tier.
    runs-on: ubuntu-latest

    # Steps: A job contains a sequence of tasks called steps.
    steps:
      # Step 1: Checks out your repository code under $GITHUB_WORKSPACE,
      # so the workflow can access it.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Sets up the Java Development Kit (JDK) environment.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      
      # Step 3: Make Gradle wrapper executable.
      # This is necessary for the runner to execute the gradlew script.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Step 4: Builds the project and runs tests using the Gradle wrapper.
      # The 'build' task compiles classes, runs tests, and assembles JAR/WAR files.
      - name: Build and Test with Gradle
        run: ./gradlew build