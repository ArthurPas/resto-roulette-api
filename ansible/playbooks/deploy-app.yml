- name: Deploy Spring Boot backend JAR
  hosts: app
  become: no
  vars:
    app_dir: "/opt/resto-roulette"
    local_repo: "/home/arthur-pascal/Documents/epitech/resto-roulette/resto-roulette-api"
  vars_files:
    - ../group_vars/app/vault.yml

  tasks:
    - name: Configure Doppler globally for user
      become: yes
      become_user: root
      shell: |
        mkdir -p /home/root/.doppler
        export DOPPLER_TOKEN="{{ doppler_service_token }}"
        export DOPPLER_PROJECT="{{ doppler_project }}"
        export DOPPLER_CONFIG="{{ doppler_config }}"
        doppler configure set token "$DOPPLER_TOKEN" --scope /home/root
        doppler configure set project "$DOPPLER_PROJECT" --scope /home/root
        doppler configure set config "$DOPPLER_CONFIG" --scope /home/root

    - name: Build Spring Boot JAR locally
      delegate_to: localhost
      shell: |
        cd "{{ local_repo }}"
        ./gradlew clean bootJar
      args:
        executable: /bin/bash

    - name: Package artifact
      delegate_to: localhost
      shell: |
        cd "{{ local_repo }}/build/libs"
        tar -czf resto-backend.tar.gz *.jar
      args:
        executable: /bin/bash

    - name: Upload artifact
      copy:
        src: "{{ local_repo }}/build/libs/resto-backend.tar.gz"
        dest: "{{ app_dir }}/app.tar.gz"
        mode: "0644"

    - name: Extract new artifact
      shell: |
        cd "{{ app_dir }}"
        tar -xzf app.tar.gz --overwrite
      args:
        executable: /bin/bash

    - name: Start Redis container
      become: yes
      shell: |
        docker run -d \
          --name my-redis \
          --restart always \
          -p 127.0.0.1:6379:6379 \
          -v /opt/redis/data:/data \
          redis:alpine
      register: redis_output
      failed_when:
        - redis_output.rc != 0
        - "'already in use' not in redis_output.stderr"

    - name: Restart Spring Boot backend
      shell: |
        sudo systemctl restart resto-roulette.service