---
- name: Deploy Resto Roulette backend on Debian VM
  hosts: resto_backends
  become: yes
  vars:
    app_dir: "/home/andydck/apps/resto-roulette-api"
    user: "andydck"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required packages (rsync + podman + compose + curl)
      apt:
        name:
          - rsync
          - podman
          - podman-compose
          - curl
          - ca-certificates
        state: present

    - name: Install Doppler CLI (if not already installed)
      shell: |
        curl -Ls https://cli.doppler.com/install.sh | sudo sh
      args:
        creates: /usr/local/bin/doppler

    - name: Ensure application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ user }}"
        mode: "0755"

    - name: Sync project files to remote host
      become: false
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../.."
        dest: "{{ app_dir }}"
        rsync_opts:
          - "--rsh=ssh -i /Users/andydecock/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
          - "--exclude=.git"
          - "--exclude=.idea"
          - "--exclude=.vscode"
          - "--exclude=build"
          - "--exclude=out"
      delegate_to: localhost

    - name: Start backend stack using Doppler & Podman
      become: false
      shell: |
        cd "{{ app_dir }}"
        doppler run -- podman-compose up -d --build
      args:
        executable: /bin/bash